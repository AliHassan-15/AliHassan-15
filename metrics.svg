<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1060" height="108" viewBox="0 0 1060 108" role="img"><title>Dean's List, teaching, models, and shipped apps</title><style>
.rise { animation: rise .5s cubic-bezier(.16,.84,.32,1) both; }
