<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img"><title>Ali Hassan — software engineer</title><style>
.rise { animation: rise .55s cubic-bezier(.16,.84,.32,1) both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .rise, .wipe, .cursor, .draw, .pop {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
    stroke-dashoffset: 0 !important;
  }
}
</style><defs><clipPath id="shell"><rect width="900" height="176" rx="16"/></clipPath></defs><g clip-path="url(#shell)"><rect width="900" height="176" fill="#101113"/><rect width="3" height="176" fill="#e0b07a"/><rect x="16" y="1" width="868" height="1" fill="#ffffff" opacity="0.07"/><style>.draw{stroke-dasharray:28;stroke-dashoffset:28;animation:draw .7s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}.name{animation:reveal 1.05s cubic-bezier(.16,.84,.32,1) both}@keyframes reveal{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}</style><line class="draw" x1="24" y1="36" x2="52" y2="36" stroke="#e0b07a" stroke-width="2"/><text class="rise" x="24" y="58" fill="#e0b07a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="12" style="animation-delay:.15s;letter-spacing:.18em">SOFTWARE ENGINEER</text><text class="name" x="22" y="108" fill="#f3efe6" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="600">Ali Hassan</text><text class="rise" x="24" y="140" fill="#8d877c" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" style="animation-delay:.35s">MERN  ·  Python  ·  Applied AI</text><text class="rise" x="876" y="102" fill="#f3efe6" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="end" style="animation-delay:.45s">Lahore, Pakistan</text><text class="rise" x="876" y="126" fill="#e0b07a" font-family="ui-sans-serif, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="end" style="animation-delay:.55s">Open to engineering roles</text><rect class="rise" x="24" y="175" width="852" height="1" fill="#2c2b28" style="animation-delay:.2s"/></g><rect x="0.5" y="0.5" width="899" height="175" rx="16" fill="none" stroke="#2c2b28"/></svg>