<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1060" height="148" viewBox="0 0 1060 148" role="img"><title>Ali Hassan, full-stack developer and AI/ML engineer</title><style>
