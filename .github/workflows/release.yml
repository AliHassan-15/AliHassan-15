name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://alihassan-15.github.io/AliHassan-15
      NEXT_PUBLIC_BASE_PATH: /AliHassan-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dependency audit (prod, high+)
        run: pnpm audit:deps

      - name: Build
        run: pnpm build

      - name: Release verification
        run: pnpm verify:release

  note:
    name: release note
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Reminder
        run: |
          echo "Quality gates passed for ${GITHUB_REF_NAME}."
          echo "Production deploy is GitHub Pages via the Pages workflow on main."
          echo "Companion: https://alihassan-15.github.io/AliHassan-15/"
